spring.application.name=ApiMarketplace
spring.datasource.url=jdbc:mysql://localhost:3308/api_marketplace
spring.datasource.username=apiuser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
jwt.secret=marketplace-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
jwt.expiration-ms=86400000
