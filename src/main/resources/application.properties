spring.application.name=ApiMarketplace
server.port=8081
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/api_marketplace}
spring.data.mongodb.database=${MONGODB_DATABASE:api_marketplace}
spring.data.mongodb.auto-index-creation=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
jwt.secret=marketplace-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
jwt.expiration-ms=86400000
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
